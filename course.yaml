title: Probability 1
description: A first university course in probability.

# Where these files can be read on the web. Each lesson page links to its
# Markdown file and its slides' file here. A fork changes this to its own
# address.
source: https://github.com/canonlearning/probability-1/blob/main

# For each lesson:
#   summary   one casual sentence, shown after its title on the home page
#   problems  the practice problems shown at its end
#   lectures  the slide decks for teaching it in class
lessons:
  - id: conditional-probability
    summary: how learning one thing changes the chance of another.
    problems:
      - dice-sum-eight
      - choir-and-instruments
      - at-least-one-six
      - two-batteries
      - flagged-email
    lectures:
      - conditional-probability
  - id: bayes-rule
    summary: which of several cases is behind what we saw.
    problems:
      - ice-cream-stand
      - three-bakers
      - another-inbox
      - lost-keys
      - second-positive-test
      - three-doors
    lectures:
      - bayes-rule
